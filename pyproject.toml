[project]
name = "bricksim-dev"
version = "0.0.0"
description = "contact-assembly-lab development environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bricksim[isaacsim]",
    # Isaac Sim 6.2 pins these; listing them selects the cu130 index below.
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    # Provides cv2 for Isaac Sim (its own build is excluded below).
    "opencv-python==4.11.0.86",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-dependencies = [
    # Isaac Sim 6.2 introduces this cv2 build (an index-only pre-release); it conflicts with opencv-python.
    "opencv-python-headless-noffmpeg",
]

[tool.uv.sources]
bricksim = { path = "python", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
