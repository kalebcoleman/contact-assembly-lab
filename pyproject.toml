[project]
name = "bricksim-dev"
version = "0.0.0"
description = "BrickSim development environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bricksim[isaacsim,stablelego]",
    "lerobot>=0.5.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "opencv-python==4.11.0.86",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "xacro>=2.1.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-dependencies = [
    # LeRobot introduces it, but it conflicts with openv-python
    "opencv-python-headless",
    # Isaac Sim 6.2 introduces this cv2 build (an index-only pre-release); it conflicts with opencv-python too.
    "opencv-python-headless-noffmpeg",
]
override-dependencies = [
    # IsaacSim vs Lerobot
    "packaging==26.0",
    "numpy==2.3.1",
]

[tool.uv.sources]
bricksim = { path = "python", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
